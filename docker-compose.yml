networks:
  traefik-net:
    external: true

services:
  frontend:
    build: .
    image: techchaide/catalogo-apps-frontend:1.0
    container_name: catalogo_apps_frontend_prod
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    env_file:
      - .env.local
    environment:
      - NEXT_PUBLIC_BASE_PATH=
      - HOSTNAME=0.0.0.0
    networks:
      - traefik-net
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-net"
      - "traefik.http.services.catalogo-apps.loadbalancer.server.port=3000"

      # 1) Página del catálogo en la raíz de apps.chaide.com.
      #    Prioridad mínima: funciona como "comodín". Las demás apps (/ACInseguras, /guard,
      #    /seguridadesGuard…) tienen reglas más específicas y siguen respondiendo en sus rutas.
      - "traefik.http.routers.catalogo-apps.rule=Host(`apps.chaide.com`)"
      - "traefik.http.routers.catalogo-apps.priority=1"
      - "traefik.http.routers.catalogo-apps.entrypoints=websecure"
      - "traefik.http.routers.catalogo-apps.tls=true"
      - "traefik.http.routers.catalogo-apps.service=catalogo-apps"

      # 2) Archivos del catálogo (JS/CSS de Next, imágenes y favicon) en la raíz.
      #    Prioridad alta: hoy otra app captura /_next en la raíz; las demás apps usan basePath
      #    (/ACInseguras/_next, /guard/_next…), así que no necesitan estas rutas.
      - "traefik.http.routers.catalogo-apps-assets.rule=Host(`apps.chaide.com`) && (PathPrefix(`/_next`) || PathPrefix(`/img`) || Path(`/favicon.ico`))"
      - "traefik.http.routers.catalogo-apps-assets.priority=1000"
      - "traefik.http.routers.catalogo-apps-assets.entrypoints=websecure"
      - "traefik.http.routers.catalogo-apps-assets.tls=true"
      - "traefik.http.routers.catalogo-apps-assets.service=catalogo-apps"
